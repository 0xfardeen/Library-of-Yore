name: Build & Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest  # ✅ Bug 1: Windows runner for .exe
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
          pip install playwright
          playwright install chromium  # ✅ Bug 3: Install browser binaries
        shell: pwsh

      - name: Build Library of Yore
        run: |
          pyinstaller --onefile --name LibraryOfYore main.py
        shell: pwsh

      - name: Prepare release artifacts
        run: |
          New-Item -ItemType Directory -Path "release-artifacts" -Force
          Copy-Item "dist\LibraryOfYore.exe" "release-artifacts\"  # ✅ Bug 4: Correct output path
          Copy-Item "loy_server.py" "release-artifacts\"          # ✅ Bug 6: Include sync server
          if (Test-Path "config") { Copy-Item "config" "release-artifacts\config" -Recurse }
        shell: pwsh

      - name: Zip app build
        run: Compress-Archive -Path "release-artifacts\*" -DestinationPath "library-of-yore-${{ github.ref_name }}.zip"  # ✅ Bug 5: Fixed double v
        shell: pwsh

      - name: Package Chrome extension
        run: |
          if (Test-Path "loy-sync-extension") {
            Set-Location "loy-sync-extension"
            Compress-Archive -Path "manifest.json","background.js","content.js","popup.html","popup.js","popup.css","icons" -DestinationPath "..\loy-sync-extension-${{ github.ref_name }}.zip" -Force
            Set-Location ..
          } else {
            Write-Warning "loy-sync-extension folder not found, skipping."
            New-Item -ItemType File -Path "loy-sync-extension-${{ github.ref_name }}.zip" -Force
          }
        shell: pwsh

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            library-of-yore-${{ github.ref_name }}.zip
            loy-sync-extension-${{ github.ref_name }}.zip
