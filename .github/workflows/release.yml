name: Build & Release

on:
  release:
    types: [published]  # Trigger when you publish a release manually or via API

permissions:
  contents: write  # Required to upload release assets

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ─────────────────────────────────────────────────────
      # 1️⃣ Build your main app (Library of Yore)
      # ─────────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install app dependencies
        run: |
          pip install -r requirements.txt
          # Add any build tools: pyinstaller, poetry, etc.

      - name: Build Library of Yore app
        run: |
          # Example using PyInstaller - adjust for your build system
          pip install pyinstaller
          pyinstaller --onefile main.py
          # Or: npm run build, poetry build, etc.

      - name: Package app build
        run: |
          mkdir -p release-artifacts
          # Adjust paths based on your actual build output
          cp dist/main* release-artifacts/ || cp build/exe*/main* release-artifacts/ || true
          # Include config files if needed
          cp -r config/ release-artifacts/ 2>/dev/null || true
          cd release-artifacts
          zip -r ../library-of-yore-v${{ github.ref_name }}.zip .
          cd ..

      # ─────────────────────────────────────────────────────
      # 2️⃣ Package the Chrome extension
      # ─────────────────────────────────────────────────────
      - name: Package Chrome extension
        run: |
          cd loy-sync-extension
          # Remove dev files, keep only production assets
          zip -r ../loy-sync-extension-v${{ github.ref_name }}.zip \
            manifest.json \
            background.js \
            content.js \
            popup.html \
            popup.js \
            popup.css \
            icons/ \
            -x "*.map" -x "*.md" -x "node_modules/*"
          cd ..

      # ─────────────────────────────────────────────────────
      # 3️⃣ Upload both artifacts to the GitHub Release
      # ─────────────────────────────────────────────────────
      - name: Upload release assets
        uses: softprops/action-gh-release@v1  # Popular, well-maintained action [[1]]
        with:
          files: |
            library-of-yore-v${{ github.ref_name }}.zip
            loy-sync-extension-v${{ github.ref_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
