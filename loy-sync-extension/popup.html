<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Library of Yore Sync</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>

  <!-- ── Header ─────────────────────────────────────────────────────────── -->
  <header class="header">
    <div class="header-left">
      <img src="icons/icon48.png" alt="" class="logo" />
      <div>
        <div class="app-name">Library of Yore</div>
        <div class="app-sub">Chapter Sync</div>
      </div>
    </div>
    <div id="server-dot" class="status-dot" title="Server status"></div>
  </header>

  <!-- ── Server offline banner ──────────────────────────────────────────── -->
  <div id="offline-banner" class="banner banner-warn hidden">
    ⚠ Server offline — run <code>python loy_server.py</code>
  </div>

  <!-- ── Current page detection ────────────────────────────────────────── -->
  <section class="section" id="current-section">
    <div class="section-title">Current Page</div>
    <div id="current-card" class="card">
      <div id="no-detection" class="muted">Navigate to a chapter page to start tracking.</div>
      <div id="detection-info" class="hidden">
        <div class="novel-title-row">
          <span id="det-site" class="site-badge"></span>
          <span id="det-title" class="novel-title"></span>
        </div>
        <div class="chapter-row">
          <span class="label">Chapter detected</span>
          <span id="det-chapter" class="chapter-num">—</span>
        </div>
        <div class="chapter-row" id="library-row" style="display:none">
          <span class="label">Library progress</span>
          <span id="lib-chapter" class="chapter-num dim">—</span>
        </div>
        <div id="sync-result" class="sync-result hidden"></div>
        <button id="sync-btn" class="btn btn-primary hidden">Sync Now</button>
      </div>
    </div>
  </section>

  <!-- ── Sync history ───────────────────────────────────────────────────── -->
  <section class="section">
    <div class="section-title-row">
      <div class="section-title">Sync History</div>
      <button id="clear-history-btn" class="btn-ghost">Clear</button>
    </div>
    <div id="history-list" class="history-list">
      <div class="muted" id="no-history">No syncs yet.</div>
    </div>
  </section>

  <script src="popup.js"></script>
</body>
</html>
